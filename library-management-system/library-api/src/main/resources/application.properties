# ====================
# Database Configuration
# ====================
spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Console (for development/testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ====================
# JPA / Hibernate Configuration
# ====================
# Create, read, update and delete tables on startup
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ====================
# Server Configuration
# ====================
server.port=8000
server.servlet.context-path=/api

# ====================
# Logging Configuration
# ====================
logging.level.root=INFO
logging.level.com.example.library=DEBUG

# ====================
# Application Information
# ====================
spring.application.name=Smart Library Management System

# ====================
# JWT Configuration (Phase 4)
# ====================
# Use a secure random secret for production. This is a dev value.
jwt.secret=ChangeMeInProdReplaceWithStrongSecretKey
# Access token expiration (milliseconds)
jwt.accessTokenExpirationMs=900000   # 15 minutes
# Refresh token expiration (milliseconds)
jwt.refreshTokenExpirationMs=604800000  # 7 days
